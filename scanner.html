<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner QR SISM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#16345b;padding:18px;font-family:Arial,sans-serif}
main{max-width:560px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 28px #0f172a18}
h1{font-size:22px;margin:0 0 8px}p{color:#64748b;line-height:1.5}#reader{width:100%;min-height:260px;border:1px dashed #b8c9df;border-radius:14px;overflow:hidden;margin:16px 0}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:#0b4a91;color:#fff;margin:4px}.secondary{background:#e8eef6;color:#16416f}
#status{padding:12px;background:#eff6ff;border-radius:10px;min-height:44px}.small{font-size:13px}
</style><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head>
<body><main><h1>Scanner QR SISM</h1><p>Izinkan kamera. Arahkan QR kartu siswa ke bingkai. Hasil otomatis dikirim ke tab SISM.</p>
<div id="reader"></div><button id="start">Mulai Kamera</button><button id="stop" class="secondary">Hentikan</button>
<p id="status">Menunggu kamera diaktifkan.</p><p class="small">Biarkan tab SISM tetap terbuka dan login.</p></main>
<script>
let scanner=null,busy=false,lastText='',lastAt=0;const statusEl=document.getElementById('status');
function show(s){statusEl.textContent=s}
async function start(){
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){show('Kamera membutuhkan HTTPS dan browser modern.');return}
 if(!window.opener||window.opener.closed){show('Tab SISM tidak ditemukan. Buka scanner melalui tombol SISM.');return}
 try{
  scanner=new Html5Qrcode('reader');const cams=await Html5Qrcode.getCameras();
  if(!cams.length){show('Kamera tidak ditemukan.');return}
  const preferred=cams.find(c=>/back|rear|environment/i.test(c.label||''))||cams[0];
  await scanner.start(preferred.id,{fps:10,qrbox:(w,h)=>{const s=Math.max(180,Math.min(280,Math.floor(Math.min(w,h)*.72)));return {width:s,height:s}}},
   text=>{const now=Date.now();if(busy||(text===lastText&&now-lastAt<2500))return;busy=true;lastText=text;lastAt=now;
    try{window.opener.postMessage({type:'SISM_QR_SCAN',qr:text},'*');show('QR terbaca. Mengirim ke SISM...')}catch(e){show('Gagal mengirim hasil ke SISM.');busy=false}},()=>{});
  show('Kamera aktif. Arahkan QR siswa ke kamera.');
 }catch(e){const n=e?.name||'Error',m=e?.message||String(e);
  if(n==='NotAllowedError')show('Izin kamera ditolak. Izinkan kamera untuk domain GitHub Pages ini.');
  else if(n==='NotReadableError')show('Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera/meeting.');
  else show('Kamera gagal dibuka ('+n+'): '+m)}
}
async function stop(){if(scanner){try{if(scanner.isScanning)await scanner.stop()}catch(e){}try{await scanner.clear()}catch(e){}scanner=null}show('Kamera dihentikan.');busy=false}
window.addEventListener('message',e=>{if(!window.opener||e.source!==window.opener||!e.data||e.data.type!=='SISM_QR_RESULT')return;show(e.data.message||(e.data.ok?'Absensi diterima.':'QR gagal diproses.'));busy=false});
document.getElementById('start').addEventListener('click',start);document.getElementById('stop').addEventListener('click',stop);
window.addEventListener('beforeunload',()=>{if(scanner&&scanner.isScanning)scanner.stop()});
</script></body></html>
